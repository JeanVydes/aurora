[project]
name = "aurora-microvm-control-plane"
version = "1.0.0"
description = "Ephemeral Code Execution IaaS — Firecracker-style MicroVM Control Plane"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aws-cdk-lib>=2.100.0,<3.0.0",
    "constructs>=10.0.0,<11.0.0",
    "boto3>=1.34.0",
    "redis>=5.0.0",
    "PyJWT>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "moto[dynamodb]>=5.0.0",
    "fakeredis>=2.21.0",
]

[tool.uv]
package = false
